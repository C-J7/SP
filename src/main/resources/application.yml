spring:
  application:
    name: studypilot-api
  profiles:
    default: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studypilot}
    username: ${DB_USERNAME:studypilot}
    password: ${DB_PASSWORD:studypilot}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://studypilot.vercel.app}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:60}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:studypilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
