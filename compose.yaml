# Production-like local stack: PostgreSQL plus the API on the prod profile.
#   docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studypilot
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypilot"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/studypilot
      DB_USERNAME: studypilot
      DB_PASSWORD: studypilot
    ports:
      - "8080:8080"
